set_volume:
  name: 设置绝对音量
  description: 把电视媒体音量设置到指定百分比（0–100）。
  target:
    entity:
      integration: letv_tv
      domain: media_player
  fields:
    volume:
      name: 音量
      description: 目标音量，0–100 的整数。
      required: true
      example: 30
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
          unit_of_measurement: "%"
